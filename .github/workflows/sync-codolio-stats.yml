name: Sync portfolio coding statistics

on:
  schedule:
    # 20:30 UTC = 02:00 IST (Asia/Kolkata, UTC+5:30, no DST), every day
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-portfolio-stats
  cancel-in-progress: false

jobs:
  sync:
    # Pinned on purpose: `ubuntu-latest` moves to Ubuntu 26.04 between 2026-10-19 and 2026-11-19.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch Codolio stats, update tagline numbers, append log row
        env:
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit_msg.txt
          STATUS_FILE: ${{ runner.temp }}/sync_status.txt
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sync_tagline_stats.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Sync Codolio stats into the hero tagline numbers of index.html and append a
          record of the run to codolio-sync-log.md.

          Only digits inside the existing tagline may change. Nothing is written to
          index.html unless every check passed. Every completed run (success or failure)
          appends exactly one row to the log; the workflow then commits only those files.
          """
          import json, os, re, stat, sys, tempfile, traceback, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          INDEX = "index.html"
          LOG = "codolio-sync-log.md"

          # ---- Codolio source (verified against the live dashboard) ------------------
          CODOLIO_ENDPOINT = "https://api.codolio.com/profile?userKey=gssriram"
          EXPECTED_PROFILE = "gssriram"
          # Codolio publishes no ready-made overall totals: the dashboard derives them from
          # the per-platform entries below (verified against the live dashboard).
          PLATFORMS_PATH = ["data", "platformProfiles", "platformProfiles"]
          # Only the four overall dashboard values are synced; every other tagline number
          # is left exactly as it is.
          SYNCED = ("problems", "contests", "active_days", "streak")
          PATHS = {m: PLATFORMS_PATH for m in SYNCED}
          # ----------------------------------------------------------------------------

          # metric -> (regex with 3 groups: prefix, NUMBER, suffix; round-down step)
          STAR = r"\d(?:&#9733;|\\u2605)\s*\("
          METRICS = {
              "problems":    (r"()(\d[\d,]*)(\+\s+Problems\s+Solved)", 10),
              "active_days": (r"()(\d[\d,]*)(\+\s+Active\s+Coding\s+Days)", 10),
              "streak":      (r"()(\d[\d,]*)(\+\s+Days\s+Current\s+Streak)", 10),
              "contests":    (r"()(\d[\d,]*)(\+\s+Contests)", 10),
              "leetcode":    (r"(LeetCode\s+)(\d[\d,]*)(\+)", 100),
              "codechef":    (r"(CodeChef\s+" + STAR + r")(\d[\d,]*)(\+\))", 100),
              "dsa":         (r"(DSA\s+" + STAR + r")(\d[\d,]*)(\+\))", 100),
              "codeforces":  (r"(Codeforces\s+Pupil\s+\()(\d[\d,]*)(\+\))", 100),
              "code360":     (r"(Code360\s+Specialist\s+\()(\d[\d,]*)(\+\))", 10),
              "atcoder":     (r"(AtCoder\s+)(\d[\d,]*)(\+)", 10),
          }

          LABELS = {
              "problems": "Problems Solved", "active_days": "Active Coding Days",
              "streak": "Days Current Streak", "contests": "Contests",
              "leetcode": "LeetCode", "codechef": "CodeChef", "dsa": "DSA",
              "codeforces": "Codeforces", "code360": "Code360", "atcoder": "AtCoder",
          }


          HTML_SCOPE = re.compile(r'(<p id="hero-tagline"[^>]*>)(.*?)(</p>)', re.S)
          JS_SCOPE = re.compile(r'(\bhero_tagline:\s*")((?:[^"\\]|\\.)*)(")', re.S)



          class SyncFailure(Exception):
              """Expected failure (source unreachable/unverifiable, tagline not found...)."""


          class LogError(Exception):
              """The log file exists but is not in the expected format; nothing is written."""


          def die(msg):
              print("ERROR: " + msg, file=sys.stderr)
              raise SyncFailure(msg)


          STATUSES = ("UPDATED", "NO CHANGES", "CHANGES NOT ENOUGH", "FAILED", "UNKNOWN ERROR")
          LOG_HEADER = ("| Run | Time (IST) | Trigger | Why it ran | Result | Problems | Contests "
                        "| Active Days | Streak | Details |")
          LOG_INTRO = (
              "# Codolio sync log\n\n"
              "Automatic record of every run of the \"Sync portfolio coding statistics\" workflow "
              "(oldest first). Times are IST. Each statistic shows the value displayed in the "
              "portfolio tagline, with the live Codolio value in brackets.\n\n"
              + LOG_HEADER + "\n|---|---|---|---|---|---|---|---|---|---|\n"
          )


          def clean(text, limit=160):
              text = re.sub(r"\s+", " ", str(text)).replace("|", "/").replace("`", "'").strip()
              return text if len(text) <= limit else text[: limit - 1] + "\u2026"


          def run_context():
              event = os.environ.get("GITHUB_EVENT_NAME", "")
              actor = clean(os.environ.get("GITHUB_ACTOR", "unknown"), 40)
              if event == "schedule":
                  trigger, why = "SCHEDULED", "Daily automatic run (2:00 AM IST schedule)"
              elif event == "workflow_dispatch":
                  trigger, why = "MANUAL", f"Started manually by {actor} (Run workflow)"
              else:
                  trigger, why = (clean(event, 30).upper() or "UNKNOWN"), f"Unexpected trigger: {clean(event, 30) or 'none'}"
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
              number = os.environ.get("GITHUB_RUN_NUMBER", "?")
              run = f"[#{number}]({server}/{repo}/actions/runs/{run_id})" if run_id and repo else f"#{number}"
              return {"trigger": trigger, "why": why, "run": run,
                      "now": datetime.now(ZoneInfo("Asia/Kolkata"))}


          def read_log():
              if not os.path.exists(LOG):
                  return LOG_INTRO
              text = open(LOG, encoding="utf-8", newline="").read()
              if LOG_HEADER not in text:
                  raise LogError(f"{LOG} exists but its table header was not found; refusing to touch it")
              return text


          def last_raw(log_text):
              """Live values (problems, contests, active_days, streak) from the newest row that has them."""
              for line in reversed(log_text.splitlines()):
                  if not line.startswith("|"):
                      continue
                  cells = [c.strip() for c in line.strip().strip("|").split("|")]
                  if len(cells) != 10:
                      continue
                  found = [re.search(r"\((\d+)\)", c) for c in cells[5:9]]
                  if all(found):
                      return tuple(int(f.group(1)) for f in found)
              return None


          def commit_message(status, ctx, raw, display, changes, details):
              now = ctx["now"]
              date = f"{now:%B} {now.day}, {now.year}"
              subject = {
                  "UPDATED": f"stats: update coding stats \u2014 {date}",
                  "NO CHANGES": f"log: coding stats unchanged \u2014 {date}",
                  "CHANGES NOT ENOUGH": f"log: coding stats moved, displays unchanged \u2014 {date}",
                  "FAILED": f"log: coding stats sync failed \u2014 {date}",
                  "UNKNOWN ERROR": f"log: coding stats sync error \u2014 {date}",
              }[status]
              if status == "UPDATED":
                  merged = {}
                  for scope_changes in changes.values():   # html and js copies are identical
                      merged.update(scope_changes)
                  body = [f"{LABELS[m]}: {o}+ \u2192 {n}+" for m in METRICS if m in merged
                          for o, n in [merged[m]]]
              else:
                  body = [details]
              body += ["", f"Trigger: {ctx['trigger']} at {now:%Y-%m-%d %H:%M} IST", f"Result: {status}"]
              if raw:
                  body.append("Stats: " + ", ".join(
                      f"{name} {display[m]}+ ({raw[m]})" for m, name in
                      (("problems", "Problems"), ("contests", "Contests"),
                       ("active_days", "Active Days"), ("streak", "Streak"))))
              body.append(f"Log: {LOG}")
              return subject + "\n\n" + "\n".join(body) + "\n"


          def log_row(status, ctx, raw, display, details):
              stat_cells = [f"{display[m]}+ ({raw[m]})" for m in SYNCED] if raw else ["\u2014"] * 4
              cells = [ctx["run"], f"{ctx['now']:%Y-%m-%d %H:%M}", ctx["trigger"], clean(ctx["why"], 80),
                       status] + stat_cells + [clean(details)]
              return "| " + " | ".join(cells) + " |"


          def atomic_write(path, text):
              directory = os.path.dirname(os.path.abspath(path))
              mode = stat.S_IMODE(os.stat(path).st_mode) if os.path.exists(path) else 0o644
              fd, tmp = tempfile.mkstemp(dir=directory, prefix=".sync-")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8", newline="") as f:
                      f.write(text)
                  os.chmod(tmp, mode)
                  os.replace(tmp, path)
              except BaseException:
                  if os.path.exists(tmp):
                      os.unlink(tmp)
                  raise


          def main():
              ctx = run_context()
              html = open(INDEX, encoding="utf-8", newline="").read()
              log_text = read_log()                       # LogError -> abort before anything happens
              previous = last_raw(log_text)
              raw = display = None
              changes, new_html = {}, html
              try:
                  raw = fetch_stats()
                  new_html, changes = apply(html, raw)
                  shown = current_values(HTML_SCOPE.search(new_html).group(2))
                  display = {m: shown[m] for m in SYNCED}
                  if new_html != html:
                      status = "UPDATED"
                      merged = {}
                      for scope_changes in changes.values():
                          merged.update(scope_changes)
                      details = "; ".join(f"{LABELS[m]} {o}+ \u2192 {n}+" for m in METRICS if m in merged
                                          for o, n in [merged[m]])
                  elif previous is not None and previous != tuple(raw[m] for m in SYNCED):
                      status = "CHANGES NOT ENOUGH"
                      details = "Live values moved since the last run but no rounded display value changed"
                  else:
                      status = "NO CHANGES"
                      details = "Rounded display values already match the portfolio"
              except SyncFailure as e:
                  status, details, raw, display, new_html = "FAILED", str(e), None, None, html
              except Exception as e:                       # anything unexpected
                  traceback.print_exc()
                  status, details, raw, display, new_html = "UNKNOWN ERROR", f"{type(e).__name__}: {e}", None, None, html

              if not log_text.endswith("\n"):
                  log_text += "\n"
              new_log = log_text + log_row(status, ctx, raw, display, details) + "\n"
              if status == "UPDATED":
                  atomic_write(INDEX, new_html)
              try:
                  atomic_write(LOG, new_log)
              except BaseException:
                  if status == "UPDATED":
                      atomic_write(INDEX, html)            # never leave a half-finished update
                  raise
              msg = commit_message(status, ctx, raw, display, changes, details)
              open(os.environ["COMMIT_MSG_FILE"], "w", encoding="utf-8").write(msg)
              open(os.environ["STATUS_FILE"], "w", encoding="utf-8").write(status)
              print(f"Result: {status} - {details}")



          def floor_to(n, step):
              return n // step * step


          def fmt(n, had_comma):
              return f"{n:,}" if had_comma else str(n)


          def update_scope(text, targets):
              """Return (new_text, {metric: (old, new)}). Only digits/commas inside numbers change."""
              changes = {}
              for m, (pat, _) in METRICS.items():
                  hits = list(re.finditer(pat, text))
                  if len(hits) != 1:
                      die(f"tagline: metric '{m}' matched {len(hits)} times (expected 1)")
                  if m not in targets:
                      continue
                  h = hits[0]
                  old = h.group(2)
                  new = fmt(targets[m], "," in old)
                  if new != old:
                      text = text[:h.start(2)] + new + text[h.end(2):]
                      changes[m] = (old, new)
              return text, changes


          def current_values(text):
              out = {}
              for m, (pat, _) in METRICS.items():
                  hits = list(re.finditer(pat, text))
                  if len(hits) != 1:
                      die(f"tagline: metric '{m}' matched {len(hits)} times (expected 1)")
                  out[m] = hits[0].group(2)
              return out


          def apply(html, raw):
              unknown = set(raw) - set(SYNCED)
              if unknown:
                  die(f"unknown metrics in source data: {sorted(unknown)}")
              targets = {m: floor_to(raw[m], METRICS[m][1]) for m in raw}
              result, all_changes = html, {}
              for name, scope in (("html", HTML_SCOPE), ("js", JS_SCOPE)):
                  found = list(scope.finditer(result))
                  if len(found) != 1:
                      die(f"{name} tagline scope matched {len(found)} times (expected 1)")
              # both copies of the tagline must agree before we touch anything
              vals = [current_values(scope.search(html).group(2)) for scope in (HTML_SCOPE, JS_SCOPE)]
              if vals[0] != vals[1]:
                  die("HTML tagline and JS hero_tagline currently disagree; refusing to edit")
              for name, scope in (("html", HTML_SCOPE), ("js", JS_SCOPE)):
                  s = scope.search(result)
                  new_inner, ch = update_scope(s.group(2), targets)
                  # safety: only digits/commas may differ
                  strip = lambda t: re.sub(r"[\d,]", "", t)
                  if strip(new_inner) != strip(s.group(2)):
                      die(f"{name}: non-numeric change detected; aborting")
                  result = result[:s.start(2)] + new_inner + result[s.end(2):]
                  all_changes[name] = ch
              return result, all_changes


          def node(data, path):
              for k in path:
                  data = data[k]
              return data


          def utc_today():
              return datetime.now(ZoneInfo("UTC")).date()


          def active_day_set(platforms):
              """Distinct UTC days with at least one submission on any platform."""
              days = set()
              for p in platforms:
                  cal = ((p.get("dailyActivityStatsResponse") or {}).get("submissionCalendar")) or {}
                  for ts, n in cal.items():
                      if int(n) > 0:
                          days.add(int(ts) // 86400)
              return days


          def derive(platforms):
              problems = sum(int(((p.get("totalQuestionStats") or {}).get("totalQuestionCounts")) or 0)
                             for p in platforms)
              contests = 0
              for p in platforms:
                  c = p.get("contestActivityStats") or {}
                  contests += len(c.get("contestActivityList") or []) + len(c.get("dsaContestActivityList") or [])
              days = active_day_set(platforms)
              today = utc_today().toordinal() - datetime(1970, 1, 1).toordinal()
              d = today if today in days else today - 1  # today may not have activity yet
              streak = 0
              while d in days:
                  streak += 1
                  d -= 1
              return {"problems": problems, "contests": contests,
                      "active_days": len(days), "streak": streak}


          def fetch_stats():
              if not CODOLIO_ENDPOINT or any(p is None for p in PATHS.values()):
                  die("Codolio endpoint / field mapping not configured")
              req = urllib.request.Request(CODOLIO_ENDPOINT, headers={
                  "accept": "application/json", "referer": "https://codolio.com/",
                  "user-agent": "Mozilla/5.0 (portfolio-stats-sync)"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      if r.status != 200:
                          die(f"Codolio returned HTTP {r.status}")
                      data = json.load(r)
              except Exception as e:
                  die(f"could not fetch Codolio: {e}")
              try:
                  if data["status"]["success"] is not True:
                      die("Codolio reported failure")
                  if data["data"]["profileName"] != EXPECTED_PROFILE:
                      die("response is not for the expected profile")
                  platforms = node(data, PLATFORMS_PATH)
                  if not isinstance(platforms, list) or len(platforms) < 2 \
                          or not all(isinstance(p, dict) and p.get("platform") for p in platforms):
                      die("platform list missing or malformed")
                  stats = derive(platforms)
              except SyncFailure:
                  raise
              except Exception as e:
                  die(f"could not extract required stats: {e}")
              if any(stats[m] < 0 for m in SYNCED) or stats["problems"] == 0 or stats["active_days"] == 0:
                  die("implausible data (zero or negative totals)")
              if stats["streak"] > stats["active_days"]:
                  die("implausible data: current streak exceeds active days")
              return {m: stats[m] for m in SYNCED}




          if __name__ == "__main__":
              try:
                  main()
              except LogError as e:
                  print("ERROR: " + str(e), file=sys.stderr)
                  sys.exit(1)
          PYEOF
          python3 "$RUNNER_TEMP/sync_tagline_stats.py"

      - name: Commit and push (only index.html and codolio-sync-log.md)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit_msg.txt
          STATUS_FILE: ${{ runner.temp }}/sync_status.txt
        run: |
          set -euo pipefail
          if [ ! -s "$STATUS_FILE" ] || [ ! -s "$COMMIT_MSG_FILE" ]; then
            echo "No sync result was recorded; aborting." >&2
            exit 1
          fi
          STATUS="$(cat "$STATUS_FILE")"
          # Safety net: nothing except these two files may differ from the checkout
          while IFS= read -r f; do
            case "$f" in
              index.html|codolio-sync-log.md|"") ;;
              *) echo "Unexpected change outside the allowed files: $f" >&2; exit 1 ;;
            esac
          done <<< "$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          if [ "$STATUS" = "UPDATED" ]; then
            if git diff --quiet -- index.html; then
              echo "Status UPDATED but index.html is unchanged; aborting." >&2; exit 1
            fi
          elif ! git diff --quiet -- index.html; then
            echo "index.html was modified on a $STATUS run; aborting." >&2; exit 1
          fi
          if [ -z "$(git status --porcelain -- codolio-sync-log.md)" ]; then
            echo "The log row was not written; aborting." >&2; exit 1
          fi
          # Author = the repo owner's GitHub account (the noreply address is always
          # linked to the account), so the commit counts as a contribution.
          ID="$(gh api "users/$OWNER" --jq .id)"
          [[ "$ID" =~ ^[0-9]+$ ]] || { echo "Could not resolve account id; aborting." >&2; exit 1; }
          export GIT_AUTHOR_NAME="Sriram G S" GIT_AUTHOR_EMAIL="${ID}+${OWNER}@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git add -- codolio-sync-log.md
          if [ "$STATUS" = "UPDATED" ]; then git add -- index.html; fi
          git commit -F "$COMMIT_MSG_FILE"
          git push || { git pull --rebase origin "$GITHUB_REF_NAME" && git push; }

      - name: Fail the run if the sync itself failed
        env:
          STATUS_FILE: ${{ runner.temp }}/sync_status.txt
        run: |
          STATUS="$(cat "$STATUS_FILE")"
          case "$STATUS" in
            FAILED|"UNKNOWN ERROR")
              echo "::error title=Codolio sync $STATUS::Recorded in codolio-sync-log.md; see the first step's log for the reason."
              exit 1 ;;
          esac
          echo "Sync result: $STATUS"
